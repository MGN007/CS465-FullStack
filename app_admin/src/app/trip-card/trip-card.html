<div class="col-3">
  <div class="card" style="width: 18rem; margin: 10px;">
    <img [src]="'assets/images/' + trip.image" class="card-img-top" alt="trip image">

    <div class="card-body">
      <h5 class="card-title">{{ trip.name }}</h5>
      <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>

      <p class="card-text">
        {{ trip.length }}<br>
        ${{ trip.perPerson }} per person
      </p>

      <p class="card-text">{{ trip.description }}</p>

      <button *ngIf="isLoggedIn()" class="btn btn-warning btn-sm me-2 mt-2" (click)="onEdit()">
        Edit
      </button>

      <button *ngIf="isLoggedIn()" class="btn btn-danger btn-sm mt-2" (click)="onDelete()">
        Delete
      </button>
    </div>
  </div>
</div>
